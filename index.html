<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Price of Influence — Interactive Vocabulary & Spaced Repetition</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',
            popover: 'var(--popover)',
            'popover-foreground': 'var(--popover-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            secondary: 'var(--secondary)',
            'secondary-foreground': 'var(--secondary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            accent: 'var(--accent)',
            'accent-foreground': 'var(--accent-foreground)',
            border: 'var(--border)',
          },
          fontFamily: {
            serif: ['Literata', 'Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-foreground transition-colors duration-200 min-h-screen flex flex-col">

  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-40 w-full border-b border-border bg-card/85 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Table of Contents Button -->
      <div class="flex items-center gap-3">
        <button onclick="window.app.toggleDrawer()" 
                class="p-2 rounded-xl hover:bg-muted text-foreground border border-border/60 transition-colors flex items-center gap-1.5 text-xs font-semibold" 
                title="Table of Contents (All 27 Laws)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/>
          </svg>
          <span class="hidden md:inline">27 Laws</span>
        </button>

        <a href="#reader" onclick="window.app.showView('reader')" class="flex flex-col">
          <span class="font-serif font-black text-base sm:text-lg tracking-tight text-foreground flex items-center gap-1.5">
            The Price of Influence
          </span>
          <span class="text-[10px] text-muted-foreground tracking-wider uppercase hidden sm:inline">
            333 Words • Cumulative Retention Engine
          </span>
        </a>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="hidden lg:flex items-center gap-1 text-sm font-medium">
        <button id="nav-link-reader" onclick="window.app.showView('reader')" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors">
          📖 Read Book
        </button>
        <button id="nav-link-quiz" onclick="window.app.startChapterQuiz(window.bookReader.currentChapter)" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors">
          ⚡ Chapter Quiz
        </button>
        <button id="nav-link-retention" onclick="window.app.showView('retention')" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors flex items-center gap-1">
          🧠 Retention Center
        </button>
        <button id="nav-link-flashcards" onclick="window.app.showView('flashcards')" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors">
          🗂️ Flashcards
        </button>
        <button id="nav-link-glossary" onclick="window.app.showView('glossary')" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors">
          📚 Glossary (333)
        </button>
        <button id="nav-link-intro" onclick="window.app.showView('intro')" class="px-3 py-2 rounded-lg hover:text-foreground transition-colors">
          ℹ️ Namar Guide
        </button>
      </nav>

      <!-- Quick Action Controls -->
      <div class="flex items-center gap-2">
        <!-- Quick Retention Workout Button -->
        <button onclick="window.app.startSpiralRetentionWorkout()"
                class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-primary text-primary-foreground text-xs font-semibold shadow-sm hover:bg-primary/90 transition-all"
                title="15-question cumulative review from all read laws">
          <span>⚡ Spiral Review</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button id="theme-toggle-btn" 
                onclick="window.app.toggleDarkMode()"
                class="p-2 rounded-xl border border-border/70 hover:bg-muted text-sm transition-colors"
                title="Toggle Light/Dark Mode">
          🌙
        </button>
      </div>

    </div>

    <!-- Mobile Navigation Sub-bar -->
    <div class="lg:hidden flex items-center justify-around border-t border-border/50 py-2 px-2 bg-card text-xs">
      <button onclick="window.app.showView('reader')" class="p-1 text-center font-medium">📖 Read</button>
      <button onclick="window.app.startChapterQuiz(window.bookReader.currentChapter)" class="p-1 text-center font-medium">⚡ Test</button>
      <button onclick="window.app.showView('retention')" class="p-1 text-center font-medium">🧠 Memory</button>
      <button onclick="window.app.showView('flashcards')" class="p-1 text-center font-medium">🗂️ Cards</button>
      <button onclick="window.app.showView('glossary')" class="p-1 text-center font-medium">📚 Glossary</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- VIEW 1: BOOK READER -->
    <div id="view-reader" class="space-y-6">
      
      <!-- Reader Controls Bar -->
      <div class="p-3 sm:p-4 rounded-2xl bg-card border border-border/70 flex flex-wrap items-center justify-between gap-3 shadow-sm">
        
        <!-- Left: Chapter Switcher -->
        <div class="flex items-center gap-2">
          <button id="reader-prev-btn" 
                  onclick="window.bookReader.loadChapter(window.bookReader.currentChapter - 1)"
                  class="p-2 rounded-lg border border-border hover:bg-muted text-xs font-bold disabled:opacity-40">
            ← Prev
          </button>
          <span id="reader-chapter-indicator" class="text-xs font-bold px-2 text-foreground font-serif">
            Law 1 of 27
          </span>
          <button id="reader-next-btn"
                  onclick="window.bookReader.loadChapter(window.bookReader.currentChapter + 1)"
                  class="p-2 rounded-lg border border-border hover:bg-muted text-xs font-bold disabled:opacity-40">
            Next →
          </button>
        </div>

        <!-- Middle: Reader Appearance Options -->
        <div class="flex items-center gap-2">
          <!-- Theme selector -->
          <div class="flex items-center border border-border rounded-lg p-0.5 bg-muted/40 text-xs font-medium">
            <button onclick="window.bookReader.setTheme('parchment')" class="px-2 py-1 rounded hover:bg-card" title="Parchment Theme">Parchment</button>
            <button onclick="window.bookReader.setTheme('paper')" class="px-2 py-1 rounded hover:bg-card" title="Clean Paper">Paper</button>
            <button onclick="window.bookReader.setTheme('dark')" class="px-2 py-1 rounded hover:bg-card" title="Dark Theme">Dark</button>
            <button onclick="window.bookReader.setTheme('slate')" class="px-2 py-1 rounded hover:bg-card" title="Slate Theme">Slate</button>
          </div>

          <!-- Font Size -->
          <div class="flex items-center border border-border rounded-lg p-0.5 text-xs font-bold">
            <button onclick="window.bookReader.setFontSize(window.bookReader.settings.fontSize - 2)" class="px-2 py-1 hover:bg-muted" title="Decrease font">A-</button>
            <button onclick="window.bookReader.setFontSize(window.bookReader.settings.fontSize + 2)" class="px-2 py-1 hover:bg-muted" title="Increase font">A+</button>
          </div>
        </div>

        <!-- Right: Audio Narration & Test Shortcut -->
        <div class="flex items-center gap-2">
          <button id="narrate-btn" onclick="window.bookReader.toggleNarration()" 
                  class="px-3 py-1.5 rounded-lg bg-secondary text-secondary-foreground hover:bg-secondary/80 text-xs font-semibold transition-all">
            🎧 Listen Law
          </button>

          <button onclick="window.app.startChapterQuiz(window.bookReader.currentChapter)"
                  class="px-3 py-1.5 rounded-lg bg-primary text-primary-foreground text-xs font-bold hover:bg-primary/90 transition-all flex items-center gap-1">
            <span>Take Test</span>
            <span>→</span>
          </button>
        </div>
      </div>

      <!-- Book Article Container -->
      <div id="reader-view" class="p-6 sm:p-12 rounded-3xl bg-card border border-border/60 shadow-xl">
        <article id="book-article" class="max-w-3xl mx-auto"></article>
      </div>

    </div>

    <!-- VIEW 2: QUIZ / TEST MODE -->
    <div id="view-quiz" class="hidden">
      <div id="quiz-view-content"></div>
    </div>

    <!-- VIEW 3: RETENTION DASHBOARD -->
    <div id="view-retention" class="hidden">
      <div id="retention-view-content"></div>
    </div>

    <!-- VIEW 4: FLASHCARD DECK TRAINER -->
    <div id="view-flashcards" class="hidden">
      <div id="flashcards-view-content"></div>
    </div>

    <!-- VIEW 5: GLOSSARY DIRECTORY -->
    <div id="view-glossary" class="hidden">
      <div id="glossary-view-content"></div>
    </div>

    <!-- VIEW 6: INTRO & NAMAR GUIDE -->
    <div id="view-intro" class="hidden">
      <div id="intro-view-content"></div>
    </div>

  </main>

  <!-- Floating Word Popover (Triggered when clicking/hovering any vocabulary word) -->
  <div id="word-popover" class="hidden z-50"></div>

  <!-- Global Full Word Detail Modal -->
  <div id="global-word-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="max-w-lg w-full bg-card border border-border rounded-3xl p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <div id="global-word-modal-content"></div>
    </div>
  </div>

  <!-- Table of Contents Sliding Drawer -->
  <div id="table-of-contents-drawer" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex justify-start">
    <div class="w-full max-w-md bg-card border-r border-border h-full shadow-2xl flex flex-col p-6 overflow-hidden">
      
      <div class="flex items-center justify-between pb-4 border-b border-border mb-4">
        <div>
          <h3 class="text-xl font-serif font-bold text-foreground">The 27 Laws of Judgment</h3>
          <p class="text-xs text-muted-foreground">Jump to any law or review retention</p>
        </div>
        <button onclick="window.app.closeDrawer()" class="p-2 rounded-lg hover:bg-muted text-muted-foreground text-lg">✕</button>
      </div>

      <div class="mb-3 flex items-center gap-2">
        <button onclick="window.app.showView('intro'); window.app.closeDrawer();" class="flex-1 py-2 px-3 rounded-xl bg-muted text-xs font-semibold text-foreground hover:bg-muted/80">
          📖 Prologue & Characters
        </button>
        <button onclick="window.app.showView('glossary'); window.app.closeDrawer();" class="flex-1 py-2 px-3 rounded-xl bg-muted text-xs font-semibold text-foreground hover:bg-muted/80">
          📚 All 333 Words
        </button>
      </div>

      <!-- Scrollable list of 27 chapters -->
      <div id="drawer-chapters-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto border-t border-border bg-card py-6 text-center text-xs text-muted-foreground">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div>
        <strong>The Price of Influence: 27 Laws of Judgment</strong> — 333 Vocabulary Masterpiece
      </div>
      <div class="flex items-center gap-4">
        <span>5 Contextual Encounters Per Word</span>
        <span>•</span>
        <span>Spaced Repetition Powered</span>
      </div>
    </div>
  </footer>

  <!-- Application Scripts -->
  <script src="data/chapters.js"></script>
  <script src="data/glossary.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/retention-view.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/glossary-view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
